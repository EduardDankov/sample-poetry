[project]
name = "sample-poetry"
version = "0.1"
description = "Sample poetry project for testing."
authors = [
    {name = "Eduard Dankov",email = "contact@dankov.dev"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
]

[tool.poetry]
packages = [
    {include = "dkvsample", from = "src"}
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "poethepoet (>=0.49.0,<0.50.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pylint (>=4.1.3,<5.0.0)",
]

[project.scripts]
local = "dkvsample.app:run_local"

[tool.poe.tasks]
lint = "pylint src/"
test-unit = "pytest tests/unit/"
test-int = "pytest tests/integration/"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
